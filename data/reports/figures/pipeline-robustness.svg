<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="980" viewBox="0 0 640 980">
  <!-- background card -->
  <rect width="640" height="980" rx="10" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="320" y="44" font-size="13" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#495057" text-anchor="middle" letter-spacing="0.8">FIGURE 3 — APPROACH 2 ROBUSTNESS EVALUATION PIPELINE</text>

  <!-- Step 1: Input Test Manifest & Clean Face Crops -->
  <rect x="74" y="62" width="534" height="74.5" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="86" y="86.5" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Input — Approach 1 Test Manifest &amp; Face Crops</text>
  <text x="86" y="108.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">FaceForensics++ C23 test split · 6,304 clean face crops across 24 videos</text>
  <text x="86" y="124.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">12 Real / 12 Fake (Original, Deepfakes, Face2Face, FaceSwap, NeuralTextures)</text>
  <circle cx="46" cy="99.25" r="14" fill="#2563eb"/>
  <text x="46" y="103.75" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">1</text>

  <!-- Step 2: Clean Baseline Evaluation & One-Pass Cache -->
  <rect x="74" y="150.5" width="534" height="84.5" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="86" y="175" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Clean Baseline Reference &amp; Single-Pass Cache</text>
  <text x="86" y="197" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Severity 0 reference evaluated once per checkpoint · Cached to disk</text>
  <text x="86" y="213" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Reused as fixed ground truth for all corruptions · Zero baseline drift</text>
  <circle cx="46" cy="192.75" r="14" fill="#0891b2"/>
  <text x="46" y="197.25" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">2</text>

  <!-- Step 3: Dynamic Transformation Engine (Pre-Resize) -->
  <rect x="74" y="249" width="534" height="236.5" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="86" y="273.5" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Controlled Image Transformations (Applied Before Resize)</text>
  <text x="86" y="293.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Dynamic in-memory processing · Deterministic seeds · Explicit RGB color space</text>

  <!-- Core Transforms Grid: 4 inner cards -->
  <!-- Card A: JPEG -->
  <rect x="86" y="303.5" width="120" height="80" rx="5" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="146" y="321" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#4c1d95" text-anchor="middle">JPEG Quality</text>
  <text x="146" y="338" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 1: Q = 80</text>
  <text x="146" y="353" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 2: Q = 50</text>
  <text x="146" y="368" font-size="10" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#dc2626" text-anchor="middle">Sev 3: Q = 20</text>

  <!-- Card B: Resolution Resize -->
  <rect x="214" y="303.5" width="120" height="80" rx="5" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="274" y="321" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#4c1d95" text-anchor="middle">Spatial Scale</text>
  <text x="274" y="338" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 1: s = 0.75</text>
  <text x="274" y="353" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 2: s = 0.50</text>
  <text x="274" y="368" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 3: s = 0.25</text>

  <!-- Card C: Darkening -->
  <rect x="342" y="303.5" width="120" height="80" rx="5" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="402" y="321" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#4c1d95" text-anchor="middle">Darkening (α &lt; 1)</text>
  <text x="402" y="338" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 1: α = 0.80</text>
  <text x="402" y="353" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 2: α = 0.60</text>
  <text x="402" y="368" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 3: α = 0.40</text>

  <!-- Card D: Brightening -->
  <rect x="470" y="303.5" width="124" height="80" rx="5" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="532" y="321" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#4c1d95" text-anchor="middle">Brightening (α &gt; 1)</text>
  <text x="532" y="338" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 1: α = 1.20</text>
  <text x="532" y="353" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#475569" text-anchor="middle">Sev 2: α = 1.40</text>
  <text x="532" y="368" font-size="10" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#dc2626" text-anchor="middle">Sev 3: α = 1.60</text>

  <!-- Optional Transforms Box -->
  <rect x="86" y="393.5" width="508" height="78" rx="5" fill="white" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="94" y="408.5" font-size="9.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#64748b" letter-spacing="0.5">PHASE 8 OPTIONAL TRANSFORMATIONS (DISABLED BY DEFAULT — RUN IN SEPARATE PASS)</text>
  <text x="94" y="424.5" font-size="10.5" font-family="Segoe UI,system-ui,sans-serif" fill="#475569">Gaussian Noise (σ ∈ {5, 15, 30}, seed=42) · Gaussian Blur (kernel ∈ {3, 5, 7}, σ ∈ {1, 2, 3})</text>
  <text x="94" y="440.5" font-size="10.5" font-family="Segoe UI,system-ui,sans-serif" fill="#475569">Contrast Scaling (f ∈ {0.80, 0.60, 0.40}) · Centered Crop (ratio ∈ {0.90, 0.80, 0.70})</text>
  <text x="94" y="456.5" font-size="10" font-style="italic" font-family="Segoe UI,system-ui,sans-serif" fill="#64748b">1 clean + 12 core conditions = 13 conditions per checkpoint (117 evaluations across 9 checkpoints)</text>

  <circle cx="46" cy="367.25" r="14" fill="#7c3aed"/>
  <text x="46" y="371.75" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">3</text>

  <!-- Step 4: Model Preprocessing & CNN Evaluation -->
  <rect x="74" y="499.5" width="534" height="106.5" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="86" y="524" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Model-Specific Resize &amp; Fixed CNN Checkpoints</text>
  <text x="86" y="546" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Architecture-specific resize after corruption: Xception (299×299) · EfficientNet-B0 (224×224) · ResNet50 (224×224)</text>
  <text x="86" y="562" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">ImageNet normalization (mean, std) · Forward pass on frozen weights (no retraining or fine-tuning)</text>
  <text x="86" y="578" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Evaluated on 9 checkpoints: 3 architectures × 3 seeds (42, 123, 2024)</text>
  <circle cx="46" cy="552.75" r="14" fill="#b45309"/>
  <text x="46" y="557.25" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">4</text>

  <!-- Step 5: Video-Level Aggregation & Decision -->
  <rect x="74" y="620" width="534" height="90.5" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="86" y="644.5" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Frame Prediction &amp; Video-Level Aggregation</text>
  <text x="86" y="666.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Frame-level sigmoid probability p ∈ [0, 1] with complete manifest metadata</text>
  <text x="86" y="682.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Video aggregation: Mean (primary) · Median &amp; Mode (secondary) · Threshold = 0.5</text>
  <text x="86" y="698.5" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Preserves video as statistical unit (24 videos per condition) · Eliminates frame-level pseudo-replication</text>
  <circle cx="46" cy="665.25" r="14" fill="#059669"/>
  <text x="46" y="669.75" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">5</text>

  <!-- Step 6: Metrics, Degradation & Statistical Analysis -->
  <rect x="74" y="724.5" width="534" height="126.5" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="86" y="749" font-size="12.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#212529">Metrics, Degradation &amp; Cross-Architecture Analysis</text>
  <text x="86" y="771" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Primary: F1, ROC-AUC, Accuracy, Precision, Recall, Confusion Matrix (overall &amp; 5 categories)</text>
  <text x="86" y="787" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Degradation deltas: ΔF1 = F1(corrupted) − F1(clean) · ΔROC-AUC · Stability: Prediction flip rate</text>
  <text x="86" y="803" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Confidence analysis: Δprobability shift · Error-state transition (Stable Correct, Failure, Correction, Persistent)</text>
  <text x="86" y="819" font-size="11.5" font-family="Segoe UI,system-ui,sans-serif" fill="#495057">Seed variance: Mean ± SD across seeds 42, 123, 2024 · Severity-response curves</text>
  <text x="86" y="835" font-size="11.5" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="#15803d">Outputs: master_summary.csv · seed_summary.csv · architecture_summary.csv · 20 visual panels</text>
  <circle cx="46" cy="787.75" r="14" fill="#15803d"/>
  <text x="46" y="792.25" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">6</text>

  <!-- Vertical Connecting Lines -->
  <line x1="46" y1="113.25" x2="46" y2="178.75" stroke="#ced4da" stroke-width="2"/>
  <line x1="46" y1="206.75" x2="46" y2="353.25" stroke="#ced4da" stroke-width="2"/>
  <line x1="46" y1="381.25" x2="46" y2="538.75" stroke="#ced4da" stroke-width="2"/>
  <line x1="46" y1="566.75" x2="46" y2="651.25" stroke="#ced4da" stroke-width="2"/>
  <line x1="46" y1="679.25" x2="46" y2="773.75" stroke="#ced4da" stroke-width="2"/>

  <!-- Final Summary Pill -->
  <text x="320" y="874.5" font-size="12" fill="#6c757d" font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">↓</text>
  <rect x="140" y="884" width="360" height="24" rx="4" fill="#212529"/>
  <text x="320" y="900" font-size="11" font-weight="bold" font-family="Segoe UI,system-ui,sans-serif" fill="white" text-anchor="middle">117 Evaluations Completed · 9 Checkpoints × 13 Conditions</text>

  <!-- Footer Citation -->
  <text x="320" y="940" font-size="10" font-family="Segoe UI,system-ui,sans-serif" fill="#64748b" text-anchor="middle">FaceForensics++ C23 · Evaluated on NVIDIA RTX 5050 · Report: data/reports/approach-2-robustness-report.md</text>
</svg>